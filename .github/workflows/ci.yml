name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  secrets-scan:                       # Gate 1: secretos expuestos (falla el PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  build-test:                         # Gate 2: build reproducible + unitarias + contrato + integracion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, unit, contract and integration tests (Testcontainers)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  sast:                               # Gate 3a: analisis estatico
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: github/codeql-action/init@v3
        with: { languages: java-kotlin, build-mode: none }
      - uses: github/codeql-action/analyze@v3

  sca:                                # Gate 3b: dependencias vulnerables (falla con HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Excepciones aceptadas con justificacion: .trivyignore (CVE, motivo, responsable, fecha)

  package:                            # Gate 4: imagen inmutable, SBOM y escaneo de imagen
    needs: [secrets-scan, build-test, sast, sca]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"     # nunca :latest como identificador
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
      - name: Verify VEX assumptions
        run: |
          set -euo pipefail
          if grep -RInE 'XsltView|XsltViewResolver|SseEmitter|ServerSentEvent|TEXT_EVENT_STREAM|text/event-stream|ModelAndView|ViewResolver|ViewController|WebMvcConfigurer|Rendering|Fragments|@Controller\b' src/main/java src/main/resources; then
            echo "::error::Reevaluar VEX: se detectaron funcionalidades MVC o SSE"
            exit 1
          fi
          echo "OK: comprobacion estatica de condiciones VEX"

      - name: Image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          trivy-config: trivy-image.yaml
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          artifact-name: sbom-${{ steps.meta.outputs.tag }}.cdx.json
          format: cyclonedx-json

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      STAGING_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy temporary staging
        run: bash scripts/ci-staging-up.sh
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8080/actuator/health
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8080/api/v1/inventory?size=1")
          echo "Una consulta sin credenciales debe devolver 401: $code"
          test "$code" = "401"
      - name: Save staging logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            logs --no-color --tail=150 > staging.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke-logs
          path: staging.log
      - name: Clean temporary staging
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            down -v --remove-orphans

  dast-sat:
    if: github.ref == 'refs/heads/main'
    needs: [package, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      STAGING_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start isolated SAT environment
        run: bash scripts/ci-staging-up.sh
      - name: SAT end-to-end
        run: bash scripts/sat.sh
        env:
          BASE_URL: http://127.0.0.1:8080
      - name: ZAP passive baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://127.0.0.1:8080/v3/api-docs \
            -f openapi -S -I -s \
            -r baseline.html -J baseline.json
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: zap-reports/
          if-no-files-found: warn
      - name: Save SAT environment logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            logs --no-color --tail=150 > sat-environment.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat-environment-logs
          path: sat-environment.log
      - name: Clean SAT environment
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            down -v --remove-orphans

  release:                            # Gate 7: tag semver + changelog + evidencia
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: production-approval  # aprobacion manual configurada en el entorno
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Imagen: `${{ env.IMAGE }}:${{ needs.package.outputs.tag }}`
            Contrato: tag `api-v1.x` | Evidencia: artefactos `test-reports`, `sbom-*`, `dast-report`

  pr-staging-validation:
    name: PR staging, SAT and DAST
    if: github.event_name == 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Start temporary environment
        run: docker compose up -d --build postgres rabbitmq app

      - name: Wait for application health
        run: |
          for i in $(seq 1 3); do
            echo "Health check attempt $i/3"
            if curl -fsS --max-time 5 \
              http://127.0.0.1:8080/actuator/health/forced-failure; then
              echo "PASS: application healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --tail=120 app
          exit 1

      - name: SAT end-to-end
        run: bash scripts/sat.sh
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: DAST passive OpenAPI scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:8080/v3/api-docs \
            -f openapi -S -I -s \
            -r pr-dast.html -J pr-dast.json

      - name: Save container logs
        if: always()
        run: |
          docker compose logs --no-color --tail=150 \
            > pr-staging.log || true

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-staging-evidence
          path: |
            zap-reports/
            pr-staging.log
          if-no-files-found: warn

      - name: Clean temporary environment
        if: always()
        run: docker compose down -v --remove-orphans
